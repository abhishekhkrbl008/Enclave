name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Mock Compact Compiler
        run: |
          sudo bash -c 'echo "#!/bin/bash" > /usr/local/bin/compact'
          sudo bash -c 'echo "echo \"Mock compiling...\"" >> /usr/local/bin/compact'
          sudo chmod +x /usr/local/bin/compact

      - name: Compile Compact contract
        run: npm run compact:compile

      - name: Lint
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
